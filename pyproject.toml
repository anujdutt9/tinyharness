[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyharness"
version = "0.1.0"
description = "A small, readable coding-agent harness: tools, permissions, skills, subagents and context management."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Anuj Dutt" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "prompt_toolkit>=3.0",
    "rich>=13.7",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]

[project.scripts]
tinyharness = "tinyharness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["tinyharness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is handled by the formatter
    "RUF001",   # we intentionally use unicode glyphs (●, ⎿, …) in UI strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["tinyharness"]  # don't infer it from which files exist

[tool.mypy]
python_version = "3.11"
packages = ["tinyharness"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tiktoken"]
ignore_missing_imports = true
