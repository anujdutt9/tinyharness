[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "tinyharness"
dynamic = ["version"]
description = "A small, readable coding agent for your terminal, and a Python SDK to build your own: tools, permissions, skills, subagents and context management, for any major model provider."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anuj Dutt" }]
keywords = ["ai", "agent", "coding-agent", "llm", "cli", "sdk", "anthropic", "openai", "gemini", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "prompt_toolkit>=3.0.52",  # ChoiceInput and input frames
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/anujdutt9/tinyharness"
Source = "https://github.com/anujdutt9/tinyharness"
Issues = "https://github.com/anujdutt9/tinyharness/issues"
Changelog = "https://github.com/anujdutt9/tinyharness/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]

[project.scripts]
tinyharness = "tinyharness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pyte>=0.8",
]

[tool.hatch.version]
path = "tinyharness/__init__.py"  # the single place the version lives

[tool.hatch.build.targets.wheel]
packages = ["tinyharness"]

[tool.hatch.build.targets.sdist]
include = ["tinyharness", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is handled by the formatter
    "RUF001",   # we intentionally use unicode glyphs (●, ⎿, …) in UI strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["tinyharness"]  # don't infer it from which files exist

[tool.mypy]
python_version = "3.11"
packages = ["tinyharness"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tiktoken"]
ignore_missing_imports = true
