# tinyharness config. Copy to ~/.tinyharness/config.toml.
# Every key is optional. API keys never go here: add them with `/key <provider>` (stored in
# ~/.tinyharness/auth.json, readable only by you), set them in your shell, or use a
# checkout-local .env while developing tinyharness. Resolution order is SDK override,
# process environment, development .env, then auth.json.
#
# Plain keys come first and [tables] last: in TOML, every key after a [table] header
# belongs to that table.

# --- Model --------------------------------------------------------------------
# Without these, tinyharness uses the last model you picked with /model, or else the
# first provider whose API key is set (see tinyharness/llm/providers.toml for the list:
# anthropic, openai, openrouter, gemini, xai, deepseek, mistral, groq).
# provider = "anthropic"
# model = "claude-sonnet-5"            # or "openai:gpt-6-sol" to name the provider too
# effort = "high"                      # low | medium | high | max; default: the model's own
# request_timeout = 1800               # seconds per model call
# request_retries = 3                  # on 429/5xx (honoring Retry-After) or a refused connection

# Background jobs can use distinct models from the active provider. Use bare model IDs,
# not provider:model specifications. Unset classifier/search roles use the provider's
# legacy small_model; compaction falls back to compaction_model, then the active model.
# [models.roles]
# safety_classifier = "claude-haiku-4-5"
# search_digest = "claude-haiku-4-5"
# compaction = "claude-sonnet-5"

# --- Workspace & permissions -------------------------------------------------
# working_dir = "~/code/project"       # default: the directory you launch from
# permission_mode = "default"          # default | auto | plan | ask | bypassPermissions

# --- Terminal -----------------------------------------------------------------
# theme = "system"                     # system (asks the terminal) | light | dark; also /theme
# show_thinking = false                # show the model's reasoning; also ctrl+t or /thinking
# prompt_suggestions = true            # after a turn, suggest your next message (Tab takes it)

# --- Tool calls ---------------------------------------------------------------
# tool_calls = "auto"                  # auto: probe each model once | native | text
#                                      # (text: tools in the prompt, calls written as <call>)

# --- Context management -------------------------------------------------------
# context_window_tokens = 200000       # default: what the provider reports for the model
# auto_compact_threshold = 0.90        # summarize older history above this fraction of the window

# --- Providers ------------------------------------------------------------------
# Models come live from each provider's model list (/model searches them). Adjust a
# built-in provider, e.g. its small (background) model, which agents get with `model: small`:
# [providers.openrouter]
# small_model = "google/gemini-3.5-flash-lite"

# Any gateway is a provider. `api` is its format: "chat" (OpenAI Chat Completions,
# the default), "responses", "anthropic" or "gemini".
# [providers.gateway]
# label = "Company gateway"
# base_url = "https://llm.internal.example.com/v1"
# api_key_env = "GATEWAY_API_KEY"      # the variable's NAME (leave out if it needs no key)
# default_model = "claude-sonnet-5"
# models = ["claude-sonnet-5", { id = "gpt-6-sol", context = 1050000 }]  # if it has no model list
# extra_headers = { "x-team" = "platform" }

# A self-hosted OpenAI-compatible server (vLLM, Ollama, SGLang): no key needed. Models
# and context windows come from its /v1/models. Agents pick one with `model: local:<id>`.
# [providers.local]
# label = "vLLM"
# base_url = "http://127.0.0.1:8000/v1"
# extra_body = { temperature = 0.2 }

# --- Permission rules ---------------------------------------------------------
# Rules are `Tool` or `Tool(glob)`; relative globs are inside working_dir and `*` also
# matches `/`. Deny beats allow. Reads inside the project never ask anyway.
# [permissions]
# allow = ["Edit(src/*)", "Write(tests/*)", "Read(~/Downloads/*)"]
# deny = ["Edit(*.lock)", "Read(*/secrets/*)"]

# --- Sandbox ------------------------------------------------------------------
# Bash commands run in an OS sandbox (native Seatbelt on macOS; optional Anthropic
# Sandbox Runtime on Linux, Windows and as a fallback): they write only to the project
# and private scratch/cache dirs, can't read credential files, and reach only allowed
# hosts. A blocked exact host can be approved without removing containment. /sandbox
# shows the active backend and limits.
# [sandbox]
# enabled = true
# required = false                    # true: fail startup if no sandbox backend is active
# allow_write = ["~/code/other-repo"]  # more writable dirs (protected like the project)
# allow_localhost = false              # true: tests may start and reach local servers
# allow_hosts = ["pypi.org", "files.pythonhosted.org", "registry.npmjs.org", "github.com",
#                "*.github.com", "*.githubusercontent.com"]  # [] = no network

# --- Extensions ---------------------------------------------------------------
# Built-in: web (WebSearch, WebFetch), pdf, open, todo, agents (Agent, Team). Your own go
# in ~/.tinyharness/extensions/<name>.py (docs/extension-api.md). Off unless listed;
# /extensions shows what each adds to every request, /extensions on <name> for a session.
# [extensions]
# enabled = ["web", "agents"]
# [extensions.myext]                   # settings an extension reads as th.config
# greeting = "hi"

# --- Cost ---------------------------------------------------------------------
# Token counts are always shown. Dollars need a price: OpenRouter reports what each call
# cost, and its model list has prices; for other providers, set them here (per million).
# [pricing]
# "anthropic:claude-sonnet-5" = { input = 3.0, output = 15.0, cached = 0.3 }
# "openai:gpt-6-sol" = { input = 2.0, output = 8.0 }
