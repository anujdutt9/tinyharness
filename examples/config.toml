# tinyharness config. Copy to ~/.config/tinyharness/config.toml.
# Every key is optional. API keys never go here; put them in your environment or a .env file.

# --- Model --------------------------------------------------------------------
# Without these, tinyharness uses the last model you picked with /model, or else the
# first provider whose API key is set (see tinyharness/llm/providers.toml for the list:
# anthropic, openai, openrouter, gemini, xai, deepseek, mistral, groq).
# provider = "anthropic"
# model = "claude-sonnet-5"            # or "openai:gpt-6-sol" to name the provider too

# Add models to a built-in provider, or change its small (background) model:
# [providers.openrouter]
# models = ["qwen/qwen3.8-max", { id = "z-ai/glm-5.3-flash", note = "tiny + cheap", context = 1310720 }]
# small_model = "google/gemini-3.5-flash-lite"

# Any OpenAI-compatible gateway (LiteLLM, Portkey, a company proxy, ...) is a provider:
# [providers.gateway]
# label = "Company gateway"
# base_url = "https://llm.internal.example.com/v1"
# api_key_env = "GATEWAY_API_KEY"      # the variable's NAME; the key itself goes in .env
# models = ["claude-sonnet-5", "gpt-6-sol"]
# extra_headers = { "x-team" = "platform" }

# request_timeout = 1800     # seconds per model call
# thinking_budget = 0        # reasoning tokens per turn (0 = off); /think changes it at runtime
# prompt_caching = true

# --- Workspace & permissions -------------------------------------------------
# working_dir = "~/code/project"   # default: the directory you launch from
# permission_mode = "default"     # plan | default | acceptEdits | auto | bypassPermissions

# Rules are `Tool` or `Tool(glob)`; relative globs are inside working_dir and `*` also
# matches `/`. Deny beats allow. Reads inside the project never ask anyway.
# [permissions]
# allow = ["Edit(src/*)", "Write(tests/*)", "Read(~/Downloads/*)"]
# deny = ["Edit(*.lock)", "Read(*/secrets/*)"]

# --- Context management ------------------------------------------------------
# context_window_tokens = 200000  # default: the model's window from the catalog
# auto_compact_threshold = 0.90   # summarize older history above this fraction of the window
