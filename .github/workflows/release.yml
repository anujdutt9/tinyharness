name: Release

# Push a tag like v0.2.0 to publish to PyPI. Run the workflow by hand (Actions tab,
# "Run workflow") to publish to TestPyPI first as a dry run.
#
# Uses PyPI trusted publishing: no API token is stored anywhere. One-time setup on
# pypi.org (and test.pypi.org): Your projects -> Publishing -> add a GitHub
# publisher with owner anujdutt9, repo tinyharness, workflow release.yml and
# environment pypi (or testpypi).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version=$(uv run python -c "import tinyharness; print(tinyharness.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/check_dist.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [quality, build]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Publish to PyPI
        if: github.event_name == 'push'
        run: uv publish --trusted-publishing always
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/
