# Built-in providers: how to connect to each one. Nothing here is about specific
# models beyond a starting default; the list of models, their context windows and
# what they support come live from each provider's own model list.
#
# Order matters: with no `provider` in your config, tinyharness picks the first one
# whose API key is set.
#
# Fields:
#   label          display name
#   api            the provider's native API format (see tinyharness/llm/adapters):
#                    anthropic  Anthropic Messages
#                    responses  OpenAI Responses
#                    gemini     Google Gemini Interactions
#                    chat       OpenAI Chat Completions (most other providers)
#   base_url       API root; the adapter adds the path
#   api_key_env    environment variable holding the key
#   key_url        where to create a key (shown when no key is set)
#   default_model  used until you pick one with /model
#   small_model    cheap, fast model for background work (the auto-mode classifier)
#   extra_headers  sent with every request
#   extra_body     merged into every request body
#   effort_param   chat API only: where the reasoning effort goes in the request
#   web_search     the provider's own web search (used by the WebSearch tool): true for
#                  APIs with a built-in search tool, or for chat providers the table
#                  that switches it on; leave out when the provider has none

[anthropic]
label = "Anthropic"
api = "anthropic"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"
key_url = "https://console.anthropic.com/settings/keys"
default_model = "claude-sonnet-5"
small_model = "claude-haiku-4-5"
web_search = true

[openai]
label = "OpenAI"
api = "responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
key_url = "https://platform.openai.com/api-keys"
default_model = "gpt-6-sol"
small_model = "gpt-6-luna"
web_search = true

[openrouter]
label = "OpenRouter"
api = "chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
key_url = "https://openrouter.ai/settings/keys"
default_model = "anthropic/claude-sonnet-5"
small_model = "anthropic/claude-haiku-4.5"
effort_param = "reasoning.effort"
extra_body = { cache_control = { type = "ephemeral" } }  # caching for models that need it asked for
web_search = { plugins = [{ id = "web" }] }

[gemini]
label = "Google Gemini"
api = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta"
api_key_env = "GEMINI_API_KEY"
key_url = "https://aistudio.google.com/apikey"
default_model = "gemini-3.8-flash"
small_model = "gemini-3.5-flash-lite"
web_search = true

[xai]
label = "xAI"
api = "responses"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
key_url = "https://console.x.ai"
default_model = "grok-4.7"
small_model = "grok-4.7"
web_search = true

[deepseek]
label = "DeepSeek"
api = "chat"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
key_url = "https://platform.deepseek.com/api_keys"
default_model = "deepseek-v4-pro"
small_model = "deepseek-flash"

[mistral]
label = "Mistral"
api = "chat"
base_url = "https://api.mistral.ai/v1"
api_key_env = "MISTRAL_API_KEY"
key_url = "https://console.mistral.ai/api-keys"
default_model = "mistral-medium-latest"
small_model = "mistral-small-latest"

[groq]
label = "Groq"
api = "chat"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
key_url = "https://console.groq.com/keys"
default_model = "openai/gpt-oss-120b"
small_model = "openai/gpt-oss-20b"
