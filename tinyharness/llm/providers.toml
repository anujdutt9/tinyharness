models = [
  { id = "openai/gpt-oss-120b", label = "gpt-oss 120B", note = "very fast inference", context = 131_072 },
  { id = "llama-3.3-70b-versatile", label = "Llama 3.3 70B", note = "very fast inference", context = 131_072 },
